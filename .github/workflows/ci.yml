name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    env:
      AZURE_STORAGE_CONNECTION_STRING: dummy_connection_string
      AZURE_CONTAINER_NAME: weather-data
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: weather_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall src main.py scheduler.py check_db.py

      - name: Run validation module import check
        run: |
          python -c "from src.validate import validate_weather_data; print('Validation module imported successfully')"

      - name: Run config import check
        run: |
          python -c "from src.config import Config; print('Config loaded successfully')"
